services:
  - type: web
    name: bookhive-backend
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bookhive-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: BOOKHIVE_JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OCR_SPACE_API_KEY
        sync: false

databases:
  - name: bookhive-db
    plan: free
    databaseName: bookhive_db
    user: bookhive_user
